[package]
name = "omarchy-nearby-helper"
version = "1.0.4"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
localsend-rs = { path = "vendor/localsend-rs", default-features = false, features = ["https"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
# A LocalSend peer asks for a client certificate, which the in-process test
# server never does. Standing up a listener that demands one keeps outgoing
# HTTPS transfers honest.
rustls = { version = "0.23.36", features = ["ring"] }
rustls-pemfile = "2.2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
