name: Verify release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable plugin release tag to verify (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read
  attestations: read

jobs:
  verify:
    name: Verify plugin's referenced helper (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            prefix: NEARBY_HELPER
          - arch: aarch64
            runner: ubuntu-24.04-arm
            prefix: NEARBY_HELPER_AARCH64
    steps:
      - name: Validate requested tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - name: Check out plugin release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag }}

      - name: Verify checksum, provenance and executable version
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          XDG_DATA_HOME: ${{ github.workspace }}/verify-data
          PREFIX: ${{ matrix.prefix }}
        shell: bash
        run: |
          set -euo pipefail
          # Releases before aarch64 support reference only an x86_64 helper.
          asset=$(awk -F= -v key="${PREFIX}_ASSET" '$1 == key {print $2}' helper-release.env)
          if [[ -z "$asset" ]]; then
            [[ "$PREFIX" != NEARBY_HELPER ]]
            echo "helper-release.env references no $(uname -m) helper"
            exit 0
          fi
          bin/nearby-helper-launcher --prefetch
          tag=$(awk -F= '$1 == "NEARBY_HELPER_TAG" {print $2}' helper-release.env)
          size=$(awk -F= -v key="${PREFIX}_SIZE" '$1 == key {print $2}' helper-release.env)
          sha=$(awk -F= -v key="${PREFIX}_SHA256" '$1 == key {print $2}' helper-release.env)
          source_sha=$(awk -F= '$1 == "NEARBY_HELPER_SOURCE_SHA" {print $2}' helper-release.env)
          workflow=$(awk -F= '$1 == "NEARBY_HELPER_RELEASE_WORKFLOW" {print $2}' helper-release.env)
          helper="$XDG_DATA_HOME/omarchy-nearby/helpers/$tag/$asset"
          [[ -f "$helper" && ! -L "$helper" ]]
          [[ "$(stat -c %s -- "$helper")" == "$size" ]]
          [[ "$(sha256sum "$helper" | cut -d' ' -f1)" == "$sha" ]]
          gh attestation verify "$helper" \
            --repo "$REPOSITORY" \
            --signer-workflow "$workflow" \
            --source-digest "$source_sha" \
            --source-ref "refs/tags/$tag" \
            --deny-self-hosted-runners
          version="${tag#helper-v}"
          [[ "$("$helper" --version)" == "omarchy-nearby-helper $version" ]]
