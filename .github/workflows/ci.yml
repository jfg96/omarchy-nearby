name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: CI checks (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Test frontend model
        run: node tests/model.test.js && node tests/panel-state.test.js && node tests/service-state.test.js && node tests/i18n.test.js

      - name: Test helper distribution
        run: bash tests/launcher.test.sh && bash tests/helper-repair.test.sh

      - name: Test received file copy, preview and clipboard picture
        run: bash tests/copy-file.test.sh && bash tests/preview-image.test.sh && bash tests/clipboard-image.test.sh

      - name: Check Rust formatting
        run: cargo fmt --manifest-path backend/Cargo.toml --all -- --check

      - name: Check Nearby helper builds
        run: cargo check --locked --manifest-path backend/Cargo.toml

      - name: Lint Nearby helper
        run: cargo clippy --all-targets --locked --manifest-path backend/Cargo.toml -- -D warnings

      - name: Test Nearby helper
        run: cargo test --locked --manifest-path backend/Cargo.toml

      - name: Test vendored localsend-rs
        run: cargo test --locked --manifest-path backend/vendor/localsend-rs/Cargo.toml --features https

  # The main ruleset requires a check named exactly "CI checks"; the matrix
  # jobs above carry the runner in their names.
  checks:
    name: CI checks
    needs: test
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every platform to pass
        run: '[[ "${{ needs.test.result }}" == success ]]'
